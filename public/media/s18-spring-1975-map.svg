<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">Ba bước ngoặt tháng Ba năm 1975</title><desc id="d">Sơ đồ thời gian khái niệm từ Tây Nguyên đến Huế và Đà Nẵng, chuyển tiếp tới tháng Tư nhưng không mô tả Chiến dịch Hồ Chí Minh.</desc><rect width="720" height="360" fill="#f5eddf"/><path d="M22 28h676v304H22z" fill="none" stroke="#bd985d" stroke-width="2"/><text x="360" y="63" text-anchor="middle" fill="#8b332e" font-family="Georgia,serif" font-size="25" font-weight="700">MÙA XUÂN 1975 · THÁNG BA</text><text x="360" y="90" text-anchor="middle" fill="#526354" font-family="sans-serif" font-size="13" letter-spacing="2">TRÌNH TỰ KHÁI NIỆM · KHÔNG PHẢI BẢN ĐỒ</text><g font-family="sans-serif"><rect x="45" y="124" width="180" height="142" rx="8" fill="#526354"/><text x="66" y="158" fill="#f5eddf" font-size="14" font-weight="700">10/3</text><text x="66" y="195" fill="#fffaf0" font-size="18">Tây Nguyên</text><text x="66" y="221" fill="#fffaf0" font-size="18">Buôn Ma Thuột</text><rect x="250" y="124" width="180" height="142" rx="8" fill="#8b332e"/><text x="271" y="158" fill="#f5eddf" font-size="14" font-weight="700">CUỐI THÁNG 3</text><text x="271" y="207" fill="#fffaf0" font-size="22">Huế</text><rect x="455" y="124" width="180" height="142" rx="8" fill="#735c32"/><text x="476" y="158" fill="#f5eddf" font-size="14" font-weight="700">29/3</text><text x="476" y="207" fill="#fffaf0" font-size="22">Đà Nẵng</text></g><g fill="#bd985d"><circle cx="237" cy="195" r="5"/><circle cx="442" cy="195" r="5"/></g><text x="360" y="300" text-anchor="middle" fill="#8b332e" font-family="sans-serif" font-size="13" font-weight="700">Chuyển tiếp: tháng Tư · chiến dịch cuối cùng được trình bày ở S19</text><text x="360" y="320" text-anchor="middle" fill="#6b5a43" font-family="sans-serif" font-size="11">Không tuyến đường · không tọa độ · không hình học địa lý</text></svg>