<title id="t">Sơ đồ khái niệm Chiến dịch Biên giới 1950</title><desc id="d">Ba thẻ sự kiện theo trình tự thời gian, không thể hiện địa lý, khoảng cách, tuyến đường hay hướng tiến quân.</desc>
