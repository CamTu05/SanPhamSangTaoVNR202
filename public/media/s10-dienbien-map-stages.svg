<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">Ba đợt Chiến dịch Điện Biên Phủ</title><desc id="d">Sơ đồ thời gian khái niệm, không thể hiện địa lý, chiến hào, vị trí hay tuyến tiến công.</desc><rect width="720" height="360" fill="#f5eddf"/><rect x="22" y="28" width="676" height="304" fill="none" stroke="#bd985d" stroke-width="2"/><text x="360" y="65" text-anchor="middle" fill="#8b332e" font-family="Georgia,serif" font-size="25" font-weight="700">56 NGÀY ĐÊM · BA ĐỢT</text><text x="360" y="92" text-anchor="middle" fill="#526354" font-family="sans-serif" font-size="13" letter-spacing="2">SƠ ĐỒ THỜI GIAN · KHÔNG PHẢI BẢN ĐỒ</text><g font-family="sans-serif"><rect x="48" y="126" width="188" height="140" rx="7" fill="#8b332e"/><text x="70" y="160" fill="#fffaf0" font-size="14" font-weight="700">ĐỢT I · 13–17/3</text><text x="70" y="198" fill="#fffaf0" font-size="19">Mở đầu chiến dịch</text><rect x="266" y="126" width="188" height="140" rx="7" fill="#526354"/><text x="288" y="160" fill="#fffaf0" font-size="14" font-weight="700">ĐỢT II · 30/3–30/4</text><text x="288" y="198" fill="#fffaf0" font-size="19">Siết chặt vòng vây</text><rect x="484" y="126" width="188" height="140" rx="7" fill="#735c32"/><text x="506" y="160" fill="#fffaf0" font-size="14" font-weight="700">ĐỢT III · 1–7/5</text><text x="506" y="198" fill="#fffaf0" font-size="19">Tổng tiến công</text><text x="506" y="226" fill="#f2d69b" font-size="15">Trạng thái cuối: 7/5</text></g><g fill="#bd985d"><circle cx="251" cy="196" r="5"/><circle cx="469" cy="196" r="5"/></g><text x="360" y="304" text-anchor="middle" fill="#6b5a43" font-family="sans-serif" font-size="12">Không hình học chiến hào · không vị trí · không tuyến hay mũi tên</text></svg>